<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEXORA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>VEXORA: The File Converter</h1>

        <p class="subtitle">
            Convert your files quickly and easily.
        </p>

        <!-- Upload Area -->

        <div id="uploadArea" class="upload-area">

            <div class="upload-icon">📁</div>

            <h2>Drop your files here</h2>

            <p>or</p>

            <label for="fileInput" class="browse-button">
                Browse Files
            </label>

            <input
                type="file"
                id="fileInput"
                multiple
                hidden
            >

            <p class="file-info">
                You can select one or multiple files.
            </p>

        </div>


        <!-- Selected Files -->

        <div id="fileSection" class="file-section hidden">

            <h2>Selected Files</h2>

            <div id="fileList"></div>

            <label for="fileInput" class="add-files-button">
                + Add More Files
            </label>

        </div>


        <!-- Conversion Section -->

        <div id="conversionSection" class="conversion-section hidden">

            <label for="formatSelect">
                Convert to:
            </label>

            <select id="formatSelect">
            </select>

            <button id="convertButton">
                Convert
            </button>

        </div>


        <!-- Status -->

        <div id="status" class="status"></div>

    </main>

    <script src="script.js"></script>

</body>

</html>
